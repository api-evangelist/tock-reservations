name: Tock
kind: company
description: >-
  Tock is a restaurant and hospitality reservations, events, and ordering
  platform used by restaurants, wineries, bars, and hotels to manage bookings,
  prepaid experiences, waitlists, and guest data. Tock is owned by American
  Express (acquired from Squarespace in 2024). Tock exposes a partner and
  enterprise-gated data API and webhook program rather than an open self-serve
  developer API - access is limited to Premium and Premium Unlimited plans and
  is provisioned by request to Tock. The documented surface consists of a
  twice-daily Data Exports API for historical reservation and guest data, a
  Guest Profile Ingest API for adding and updating basic guest information and
  tags, and real-time reservation and guest-profile webhooks. Reservation
  records cannot be created or manipulated through the API. Data-model reference
  documentation is published publicly at api.exploretock.com, but concrete
  endpoint paths, methods, and OpenAPI definitions are only shared with
  approved partners; the API entries below are modeled from the public data
  model and API FAQ.
